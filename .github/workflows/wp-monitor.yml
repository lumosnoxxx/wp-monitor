
name: WordPress Monitor

on:
  workflow_dispatch:

jobs:
  check-wordpress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure monitored sites
        env:
          WP_SITES: ${{ secrets.WP_SITES }}
        run: |
          if [ -z "$WP_SITES" ]; then
            echo "WP_SITES is not configured"
            exit 1
          fi
          printf '%s\n' "$WP_SITES" > sites.txt

      - name: Run WordPress checks
        run: python main.py check
